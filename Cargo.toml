[package]
name = "csv_phonebook"
version = "1.0.0"
edition = "2021"
description = "CSV電話帳処理ツール - CSV形式の電話帳をナカヨ電話機用フォーマットに変換・整理するツール"
authors = ["TNC"]
license = "MIT"
repository = "https://github.com/pastorius-tel/SpeedDialSorter_rust"

[[bin]]
name = "csv_phonebook"
path = "src/main.rs"

[dependencies]
# GUI（egui 0.27 系で固定：0.28以降はAPIが変わるため）
eframe = "~0.27"
egui   = "~0.27"

# CSV処理
csv = "~1.3"

# 文字エンコーディング検出・変換
encoding_rs = "~0.8"
chardetng   = "~0.1"

# 正規表現
regex = "~1.10"

# Unicode正規化
unicode-normalization = "~0.1"

# 日時
chrono = "~0.4"

# ログ
log        = "~0.4"
env_logger = "~0.11"

# スレッド間通信
crossbeam-channel = "~0.5"

# エラーハンドリング
thiserror = "~1.0"

# ファイルダイアログ
rfd = "~0.14"

# アイコン読み込み（ウィンドウアイコン用）
ico = "~0.3"

[profile.release]
opt-level = 3
lto = true

# Windows EXE アイコン埋め込み（build.rs で使用）
[build-dependencies]
winres = "~0.1"
